<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Gunnu 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #f48fb1;
    --pink-light: #fce4ec;
    --pink-deep: #e91e63;
    --pink-soft: #f8bbd9;
    --red-brown: #8B2500;
    --cream: #fff9f0;
    --heart-bg: #f8a5c2;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* SLIDE SYSTEM */
  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .slide.active {
    opacity: 1;
    pointer-events: all;
  }

  /* ===================== SLIDE 1: PIN ENTRY ===================== */
  #slide-pin {
    background: white;
    flex-direction: row;
    gap: 0;
  }
  .pin-left {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pin-left img { width: 340px; max-width: 45vw; }
  .pin-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .pin-display {
    display: flex;
    gap: 12px;
    margin-bottom: 10px;
  }
  .pin-box {
    width: 60px; height: 60px;
    border: 3px solid #111;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-family: 'Fredoka One', cursive;
    color: var(--pink-deep);
    transition: all 0.2s;
  }
  .pin-box.filled { background: var(--pink-light); }
  .pin-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .heart-btn {
    width: 72px; height: 72px;
    background: var(--heart-bg);
    border: none;
    cursor: pointer;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    clip-path: url(#heart);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: var(--pink-deep);
    position: relative;
    transition: transform 0.15s, background 0.15s;
  }
  .heart-btn:hover { transform: scale(1.1); background: var(--pink); }
  .heart-btn:active { transform: scale(0.95); }
  /* Heart shape via CSS */
  .heart-btn::before, .heart-btn::after {
    content: '';
    position: absolute;
    background: inherit;
    border-radius: 50%;
  }
  /* Using a simpler heart approach */
  .heart-shape {
    width: 72px; height: 65px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .heart-shape::before, .heart-shape::after {
    content: '';
    position: absolute;
    top: 0;
    width: 36px; height: 58px;
    background: var(--heart-bg);
    border-radius: 36px 36px 0 0;
    transition: background 0.15s;
  }
  .heart-shape::before { left: 36px; transform: rotate(-45deg); transform-origin: 0 100%; }
  .heart-shape::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }
  .heart-shape:hover::before, .heart-shape:hover::after { background: var(--pink); }
  .heart-shape span {
    position: relative;
    z-index: 2;
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: var(--pink-deep);
    margin-top: 18px;
  }
  .pin-error {
    color: var(--pink-deep);
    font-family: 'Caveat', cursive;
    font-size: 18px;
    height: 24px;
  }

  /* ===================== SLIDE 2: HAPPY BIRTHDAY SNOOPY ===================== */
  #slide-hb {
    background: white;
    flex-direction: column;
    gap: 0;
  }
  .hb-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    animation: popIn 0.7s ease;
  }
  @keyframes popIn {
    0% { transform: scale(0.7); opacity: 0; }
    70% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }
  .hb-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(48px, 8vw, 96px);
    background: linear-gradient(135deg, #ff69b4, #ff1493, #ff69b4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    filter: drop-shadow(2px 2px 0 #ffd6e7);
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.1;
  }
  .sparkle {
    position: absolute;
    font-size: 24px;
    animation: sparkle 1s ease-in-out infinite alternate;
  }
  @keyframes sparkle { 0% { opacity: 0.4; transform: scale(0.8) rotate(-10deg); } 100% { opacity: 1; transform: scale(1.2) rotate(10deg); } }
  .hb-snoopy { width: 280px; animation: bounce 1.2s ease infinite alternate; }
  @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-12px); } }
  @keyframes offerFlower {
    0%   { transform: translateY(0px) rotate(-4deg); }
    40%  { transform: translateY(-10px) rotate(2deg); }
    70%  { transform: translateY(-16px) rotate(5deg); }
    100% { transform: translateY(-8px) rotate(0deg); }
  }
  .next-btn {
    background: var(--pink-soft);
    border: none;
    border-radius: 50px;
    padding: 14px 36px;
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: var(--pink-deep);
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
    box-shadow: 0 4px 15px rgba(244,143,177,0.4);
    margin-top: 10px;
  }
  .next-btn:hover { transform: scale(1.07); background: var(--pink); color: white; }

  /* ===================== SLIDE 3: MAKE A WISH ===================== */
  #slide-wish {
    background: white;
    flex-direction: column;
    gap: 30px;
  }
  .wish-title {
    font-family: 'Caveat', cursive;
    font-size: clamp(36px, 6vw, 72px);
    color: var(--red-brown);
    text-align: center;
  }
  .cake-wrap { position: relative; display: flex; flex-direction: column; align-items: center; }
  .cake-img { width: min(420px, 80vw); }
  .blow-btn {
    position: absolute;
    bottom: 10px;
    background: var(--pink-soft);
    border: none;
    border-radius: 16px;
    padding: 12px 30px;
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: var(--pink-deep);
    cursor: pointer;
    transition: all 0.2s;
  }
  .blow-btn:hover { background: var(--pink-deep); color: white; transform: scale(1.05); }
  .candles-out { display: none; }

  /* ===================== SLIDE 4: NAME REVEAL ===================== */
  #slide-name {
    background: white;
    flex-direction: column;
    gap: 20px;
  }
  .name-title {
    font-family: 'Caveat', cursive;
    font-size: clamp(32px, 6vw, 72px);
    color: var(--red-brown);
    text-align: center;
    animation: fadeSlideUp 0.8s ease;
  }
  .name-cake { width: min(500px, 85vw); animation: fadeSlideUp 0.8s ease 0.2s both; }
  @keyframes fadeSlideUp {
    0% { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ===================== SLIDE 5: CHOOSE ===================== */
  #slide-choose {
    background: white;
    flex-direction: column;
    gap: 30px;
    padding: 30px;
  }
  .choose-header {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .choose-title {
    font-family: 'Caveat', cursive;
    font-size: clamp(28px, 5vw, 58px);
    color: var(--red-brown);
    text-align: center;
  }
  .choose-sub {
    font-family: 'Caveat', cursive;
    font-size: clamp(22px, 3.5vw, 40px);
    color: var(--pink-deep);
    text-align: center;
  }
  .choose-items {
    display: flex;
    gap: 40px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  .choose-item {
    cursor: pointer;
    transition: transform 0.25s;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .choose-item:hover { transform: scale(1.12) rotate(-2deg); }
  .choose-item img { width: clamp(100px, 15vw, 160px); }
  .snoopy-corner { width: 80px; }

  /* ===================== SLIDE 6: CAMERA / PIC ===================== */
  #slide-camera {
    background: white;
    flex-direction: column;
    gap: 20px;
    align-items: center;
    justify-content: center;
  }
  .cam-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(24px, 4vw, 52px);
    color: var(--red-brown);
    text-align: center;
  }
  .camera-wrap {
    position: relative;
    width: min(340px, 80vw);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .camera-img { width: 100%; }
  .polaroid {
    position: absolute;
    top: -60px;
    width: 62%;
    background: white;
    padding: 8px 8px 30px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    transform: rotate(3deg);
    animation: slideOut 0.5s ease;
  }
  .polaroid img { width: 100%; display: block; }
  @keyframes slideOut {
    0% { top: 0; opacity: 0; }
    100% { top: -60px; opacity: 1; }
  }
  .cam-caption {
    font-family: 'Caveat', cursive;
    font-size: clamp(18px, 3vw, 36px);
    color: var(--red-brown);
    font-weight: 700;
    text-align: center;
  }

  /* ===================== SLIDE 7: LOVE NOTE ===================== */
  #slide-note {
    background: white;
    flex-direction: row;
    gap: 30px;
    padding: 40px;
    flex-wrap: wrap;
  }
  .note-photos {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
  }
  .stamp-photo {
    border: 6px solid var(--red-brown);
    padding: 0;
    width: clamp(120px, 18vw, 200px);
    aspect-ratio: 3/4;
    object-fit: cover;
    border-radius: 4px;
    box-shadow: 4px 4px 12px rgba(0,0,0,0.15);
  }
  .mirror-photo {
    width: clamp(140px, 20vw, 220px);
    border-radius: 8px;
    box-shadow: 4px 4px 12px rgba(0,0,0,0.15);
  }
  .note-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    min-width: 280px;
  }
  .clipboard {
    background: #f5f0e0;
    border: 2px solid #c5b99a;
    border-radius: 8px;
    padding: 30px 24px 24px;
    position: relative;
    box-shadow: 4px 4px 12px rgba(0,0,0,0.12);
    max-width: 380px;
    background-image: repeating-linear-gradient(transparent, transparent 27px, #d0c9b0 28px);
    line-height: 28px;
  }
  .clipboard::before {
    content: '';
    position: absolute;
    top: -18px; left: 50%; transform: translateX(-50%);
    width: 60px; height: 36px;
    background: #c9a84c;
    border-radius: 8px 8px 4px 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .clipboard-text {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(13px, 1.8vw, 18px);
    color: #333;
    text-align: center;
    line-height: 28px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .flower-accent {
    font-size: 32px;
    position: absolute;
    top: -20px; right: -20px;
  }

  /* ===================== SLIDE 8: SONG ===================== */
  #slide-song {
    background: #1a3a3a;
    flex-direction: column;
    gap: 30px;
    align-items: center;
    justify-content: center;
  }
  .song-embed {
    width: min(700px, 90vw);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  .song-embed iframe { display: block; }
  .song-caption {
    font-family: 'Caveat', cursive;
    font-size: 28px;
    color: white;
    opacity: 0.8;
    letter-spacing: 1px;
  }

  /* CONFETTI */
  .confetti-piece {
    position: fixed;
    width: 10px; height: 14px;
    top: -20px;
    animation: confettiFall linear forwards;
    border-radius: 2px;
    pointer-events: none;
    z-index: 999;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* HEARTS FLOAT */
  .floating-heart {
    position: fixed;
    font-size: 20px;
    animation: floatUp 2.5s ease forwards;
    pointer-events: none;
    z-index: 999;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-200px) scale(1.5); }
  }
</style>
</head>
